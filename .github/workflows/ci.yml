name: CI quality gate

# Pull requests keep a standalone quality gate. Main pushes run these same checks
# in deploy-pages.yml; do not duplicate the entire pipeline on every release.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit/domain, no network)
        run: npm test
      - name: Build
        run: npm run build

name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:all
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  # Agent H (H8): the Pages deployment must NOT ship on unit/build green alone. Run the
  # critical browser E2E subset (the three chains this cycle touched + backup) against a real
  # preview of the built app and gate `deploy` on it. Uses the Playwright-bundled Chromium so
  # it does NOT depend on a Windows runner having Edge installed. Failures block deployment.
  browser-e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright-core install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Critical browser E2E (gate deploy)
        env:
          RELEASE_SKIP_UNIT: '1'
          RELEASE_E2E: 'e2e-artifacts,e2e-document-reader,e2e-document-context,e2e-ai-toc,e2e-ai-toc-navigation,e2e-branching,e2e-backup'
          PLAYWRIGHT_CHANNEL: 'chromium'
        run: npm run test:release
  deploy:
    needs: [build, browser-e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
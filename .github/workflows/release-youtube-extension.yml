name: Attach YouTube extension to releases
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
permissions:
  contents: write
jobs:
  extension:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Package extension
        working-directory: extensions/youtube-bridge
        run: zip -j "$RUNNER_TEMP/AI-Education-Reader-YouTube-Bridge.zip" manifest.json background.js reader.js extractor.js
      - name: Attach fixed-name download
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/AI-Education-Reader-YouTube-Bridge.zip" --clobber
